# Production-only server blocks. Mounted into /etc/nginx/conf.d/ by
# docker-compose.prod.yml; picked up automatically via nginx.conf's
# `include /etc/nginx/conf.d/*.conf;`. Requires the SSL cert volumes and
# the certbot webroot volume also declared in docker-compose.prod.yml.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name coevolutionary.org www.coevolutionary.org;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    include /etc/nginx/app-locations.conf;
}

server {
    listen 80;
    listen [::]:80;
    server_name coevolutionary.org www.coevolutionary.org;

    # 1) Serve ACME HTTP-01 challenges
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # 2) Redirect everything else to HTTPS (preserve host + path)
    location / {
        return 301 https://$host$request_uri;
    }
}
