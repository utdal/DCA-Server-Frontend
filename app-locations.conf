# Shared by both the dev (plain HTTP) and prod (HTTPS) server blocks.
# Serve React static files
root /usr/share/nginx/html;
index index.html;

# All API traffic → Django backend service on same Docker network
location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Strip bad headers
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;

    # CORS Headers
    set $cors_origin "";
    if ($http_origin ~* "^https://(www\.)?coevolutionary\.org$") {
        set $cors_origin $http_origin;
    }
    add_header 'Access-Control-Allow-Origin' "$cors_origin" always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
    add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;

    # Preflight OPTIONS
    if ($request_method = OPTIONS) {
        add_header 'Access-Control-Max-Age' 1728000;
        add_header 'Content-Type' 'text/plain; charset=UTF-8';
        add_header 'Content-Length' 0;
        return 204;
    }
}

# Static data files fetched cross-origin (bare domain <-> www host)
location /prosspec/files/ {
    alias /usr/share/nginx/html/prosspec/files/;

    set $cors_origin "";
    if ($http_origin ~* "^https://(www\.)?coevolutionary\.org$") {
        set $cors_origin $http_origin;
    }
    add_header 'Access-Control-Allow-Origin' "$cors_origin" always;
    add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;

    if ($request_method = OPTIONS) {
        add_header 'Access-Control-Allow-Origin' "$cors_origin" always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
        add_header 'Access-Control-Max-Age' 1728000;
        add_header 'Content-Type' 'text/plain; charset=UTF-8';
        add_header 'Content-Length' 0;
        return 204;
    }
}

location /prosspec {
    # alias /home/ec2-user/prosspec-app/build/;
    alias /usr/share/nginx/html/prosspec/;
    index index.html;
    try_files $uri $uri/ /index.html;
}

# SPA fallback – send everything else to index.html
location / {
    try_files $uri /index.html;
}
